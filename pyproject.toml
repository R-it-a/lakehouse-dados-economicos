[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-dados-economicos"
version = "0.1.0"
description = "Lakehouse de indicadores econômicos brasileiros com Airflow, Polars e Delta Lake"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rita Farias" }]
dependencies = [
    "polars>=1.20",
    "deltalake>=0.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "dags"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
